<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | متجر العربي</title>
    <style>
        :root {
            --primary: #00ff88;
            --secondary: #7000ff;
            --dark: #0b0f19;
            --darker: #05070c;
            --card-bg: #131b2e;
            --text: #f3f4f6;
            --text-gray: #9ca3af;
            --accent: #ff0055;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background: var(--dark); color: var(--text); padding: 20px; }
        .container { max-width: 600px; margin: 40px auto; background: var(--card-bg); padding: 30px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); }
        h2, h3 { text-align: center; margin-bottom: 25px; color: var(--primary); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.95rem; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; font-size: 1rem; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: none; }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: var(--darker); border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-danger { background: var(--accent); color: white; margin-top: 10px; }
        .login-screen, .admin-panel { display: none; }
        .active { display: block; }
        .product-list-item { display: flex; justify-content: space-between; align-items: center; background: #1e293b; padding: 10px 15px; border-radius: 8px; margin-bottom: 10px; }
        .product-list-item img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; margin-left: 10px; }
        .delete-btn { background: var(--accent); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: var(--text-gray); text-decoration: none; }
        .back-link:hover { color: var(--primary); }
    </style>
</head>
<body>

    <div class="container">
        <!-- Login Screen -->
        <div id="loginScreen" class="login-screen active">
            <h2>تسجيل دخول الإدارة</h2>
            <div class="form-group">
                <label>كلمة السر:</label>
                <input type="password" id="adminPassword" placeholder="أدخل كلمة السر">
            </div>
            <button class="btn" onclick="checkLogin()">دخول</button>
            <p id="loginError" style="color: var(--accent); text-align: center; margin-top: 10px; display: none;">كلمة السر غير صحيحة!</p>
            <a href="index.html" class="back-link">العودة إلى الموقع الرئيسي</a>
        </div>

        <!-- Admin Dashboard -->
        <div id="adminPanel" class="admin-panel">
            <h2>لوحة التحكم - إضافة منتج</h2>
            <form id="productForm" onsubmit="addProduct(event)">
                <div class="form-group">
                    <label>اسم المنتج:</label>
                    <input type="text" id="prodName" required placeholder="مثال: PlayStation 4 Slim 1TB">
                </div>
                <div class="form-group">
                    <label>القسم:</label>
                    <select id="prodCategory">
                        <option value="كمبيوتر ولابتوب">كمبيوتر ولابتوب</option>
                        <option value="بلايستيشن">بلايستيشن</option>
                        <option value="شاشات عرض">شاشات عرض</option>
                        <option value="كاميرات مراقبة">كاميرات مراقبة</option>
                        <option value="ماكينات تصوير وطابعات">ماكينات تصوير وطابعات</option>
                        <option value="الاكسسوارات والمستلزمات">الاكسسوارات والمستلزمات</option>
                        <option value="خدمات الصيانة">خدمات الصيانة</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>السعر (بالجنيه):</label>
                    <input type="number" id="prodPrice" required placeholder="مثال: 12000">
                </div>
                <div class="form-group">
                    <label>صورة المنتج (اختر من جهازك أو موبايلك):</label>
                    <input type="file" id="prodImage" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label>وصف مختصر (اختياري):</label>
                    <textarea id="prodDesc" rows="2" placeholder="تفاصيل سريعة عن المنتج..."></textarea>
                </div>
                <button type="submit" class="btn">إضافة المنتج للموقع</button>
            </form>

            <hr style="border: 0; border-top: 1px solid #334155; margin: 30px 0;">

            <h3>المنتجات الحالية</h3>
            <div id="adminProductsList" style="margin-top: 15px; max-height: 300px; overflow-y: auto;">
                <!-- Existing products loaded here -->
            </div>

            <button class="btn btn-danger" onclick="logout()">تسجيل الخروج</button>
            <a href="index.html" class="back-link">معاينة الموقع الرئيسي</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
        import {
            getFirestore,
            collection,
            getDocs,
            addDoc,
            deleteDoc,
            doc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
        import { firebaseConfig } from "./firebase-config.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const CORRECT_PASSWORD = "123";

        window.checkLogin = function() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === CORRECT_PASSWORD) {
                localStorage.setItem('alarabi_logged_in', 'true');
                showPanel();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        };

        function showPanel() {
            document.getElementById('loginScreen').classList.remove('active');
            document.getElementById('adminPanel').classList.add('active');
            renderAdminProducts();
        }

        window.logout = function() {
            localStorage.removeItem('alarabi_logged_in');
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('loginScreen').classList.add('active');
            document.getElementById('adminPassword').value = '';
        };

        async function getProducts() {
            const snapshot = await getDocs(collection(db, 'products'));
            const products = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
            products.sort((a, b) => getTime(b.createdAt) - getTime(a.createdAt));
            return products;
        }

        function getTime(value) {
            if (!value) return 0;
            if (typeof value.toMillis === 'function') return value.toMillis();
            if (value.seconds) return value.seconds * 1000;
            return 0;
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        window.addProduct = async function(e) {
            e.preventDefault();
            const submitButton = e.submitter || document.querySelector('#productForm .btn');
            submitButton.disabled = true;
            submitButton.textContent = 'جاري الحفظ...';

            const name = document.getElementById('prodName').value.trim();
            const category = document.getElementById('prodCategory').value;
            const price = Number(document.getElementById('prodPrice').value);
            const desc = document.getElementById('prodDesc').value.trim();
            const imageFile = document.getElementById('prodImage').files[0];

            try {
                if (!imageFile) throw new Error('الرجاء اختيار صورة المنتج');
                if (!name || !Number.isFinite(price)) throw new Error('تأكد من اسم المنتج والسعر');

                const compressedImage = await compressImage(imageFile);
                // Firestore documents have a 1 MiB limit. Keep the image comfortably below it.
                if (compressedImage.length > 900000) {
                    throw new Error('الصورة ما زالت كبيرة. اختر صورة أصغر.');
                }

                await addDoc(collection(db, 'products'), {
                    name,
                    category,
                    price,
                    description: desc,
                    image: compressedImage,
                    createdAt: serverTimestamp()
                });

                alert('تم إضافة المنتج بنجاح، وسيظهر الآن لكل زوار المتجر.');
                document.getElementById('productForm').reset();
                await renderAdminProducts();
            } catch (error) {
                console.error(error);
                alert(error.message || 'حدث خطأ أثناء إضافة المنتج.');
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'إضافة المنتج للموقع';
            }
        };

        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onerror = () => reject(new Error('تعذر قراءة الصورة'));
                reader.onload = () => {
                    const img = new Image();
                    img.onerror = () => reject(new Error('الصورة غير صالحة'));
                    img.onload = () => {
                        const maxSize = 1000;
                        let width = img.width;
                        let height = img.height;
                        if (width > maxSize || height > maxSize) {
                            const scale = Math.min(maxSize / width, maxSize / height);
                            width = Math.round(width * scale);
                            height = Math.round(height * scale);
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.72));
                    };
                    img.src = reader.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function renderAdminProducts() {
            const listContainer = document.getElementById('adminProductsList');
            listContainer.innerHTML = '<p style="color: var(--text-gray); text-align: center;">جاري تحميل المنتجات...</p>';
            try {
                const products = await getProducts();
                if (products.length === 0) {
                    listContainer.innerHTML = '<p style="color: var(--text-gray); text-align: center;">لا توجد منتجات مسجلة.</p>';
                    return;
                }

                listContainer.innerHTML = '';
                products.forEach(prod => {
                    const div = document.createElement('div');
                    div.className = 'product-list-item';
                    div.innerHTML = `
                        <div style="display: flex; align-items: center; overflow: hidden;">
                            <img src="${escapeHtml(prod.image || '')}" alt="">
                            <div>
                                <div style="font-weight: bold; font-size: 0.9rem;">${escapeHtml(prod.name || '')}</div>
                                <div style="font-size: 0.8rem; color: var(--primary);">${escapeHtml(String(prod.price ?? ''))} ج.م - ${escapeHtml(prod.category || '')}</div>
                            </div>
                        </div>
                        <button class="delete-btn" onclick="deleteProduct('${encodeURIComponent(prod.id)}')">حذف</button>
                    `;
                    listContainer.appendChild(div);
                });
            } catch (error) {
                console.error(error);
                listContainer.innerHTML = '<p style="color: var(--accent); text-align: center;">تعذر تحميل المنتجات. تأكد من إعداد Firestore وقواعد الوصول.</p>';
            }
        }

        window.deleteProduct = async function(encodedId) {
            const id = decodeURIComponent(encodedId);
            if (!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;
            try {
                await deleteDoc(doc(db, 'products', id));
                await renderAdminProducts();
                alert('تم حذف المنتج.');
            } catch (error) {
                console.error(error);
                alert('تعذر حذف المنتج. تأكد من قواعد Firestore.');
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('alarabi_logged_in') === 'true') showPanel();
        });
    </script>
</body>
</html>
